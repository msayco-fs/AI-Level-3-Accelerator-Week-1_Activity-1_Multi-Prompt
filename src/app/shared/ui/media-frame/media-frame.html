@if (url(); as resolved) {
  <img
    [src]="resolved"
    [alt]="alt()"
    [width]="width()"
    [height]="height()"
    [loading]="priority() ? 'eager' : 'lazy'"
    [attr.fetchpriority]="priority() ? 'high' : null"
    decoding="async"
    class="h-full w-full object-cover"
  />
} @else {
  <!-- Placeholder. aria-hidden + role=img with no label: the surrounding
       figure/caption already carries the accessible text, so announcing a
       decorative stand-in would only add noise. -->
  <svg
    class="h-full w-full"
    viewBox="0 0 400 300"
    preserveAspectRatio="xMidYMid slice"
    aria-hidden="true"
    focusable="false"
  >
    <defs>
      <linearGradient [attr.id]="gradientId" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#37435a" />
        <stop offset="100%" stop-color="#212a3b" />
      </linearGradient>
    </defs>

    <rect width="400" height="300" [attr.fill]="'url(#' + gradientId + ')'" />

    <!-- Soft gold wash -->
    <circle cx="330" cy="60" r="120" fill="#c8b373" opacity="0.07" />
    <circle cx="70" cy="250" r="100" fill="#742726" opacity="0.14" />

    <g
      stroke="#c8b373"
      stroke-width="2.5"
      fill="none"
      opacity="0.4"
      stroke-linecap="round"
      stroke-linejoin="round"
      transform="translate(200 150)"
    >
      @switch (variant()) {
        @case (0) {
          <!-- Cup + steam -->
          <path d="M-34 -12h58v26a26 26 0 0 1-26 26h-6a26 26 0 0 1-26-26v-26Z" />
          <path d="M24 -4h10a12 12 0 0 1 0 24h-10" />
          <path d="M-14 -30c0-8 8-8 8-16s-8-8-8-16" opacity="0.75" />
          <path d="M4 -30c0-8 8-8 8-16s-8-8-8-16" opacity="0.75" />
        }
        @case (1) {
          <!-- Tea leaf -->
          <path d="M-38 38C-38-8-8-38 38-38c0 46-30 76-76 76Z" />
          <path d="M-20 20 22-22" />
          <path d="M-2 2-8-18M-2 2 18 8" opacity="0.75" />
        }
        @default {
          <!-- Whisk / chasen -->
          <path d="M-6 -42h12v34h-12z" />
          <path d="M-26 -8h52l-6 34a10 10 0 0 1-10 8h-20a10 10 0 0 1-10-8Z" />
          <path d="M-14 -8v42M0 -8v42M14 -8v42" opacity="0.6" />
        }
      }
    </g>
  </svg>
}
