<!-- ============================================================
     HERO — full-viewport, dark, gold accents
     ============================================================ -->
<section
  id="home"
  class="relative isolate flex min-h-svh items-center overflow-hidden bg-primary-600 pt-(--header-h)"
  aria-labelledby="hero-heading"
>
  <!-- Decorative background: replaced by hero photo + gradient scrim in Phase 2 -->
  <div class="absolute inset-0 -z-10" aria-hidden="true">
    <div
      class="absolute -top-1/4 -right-1/4 size-[46rem] rounded-full bg-secondary-400/10 blur-3xl"
    ></div>
    <div
      class="absolute -bottom-1/3 -left-1/5 size-[38rem] rounded-full bg-accent-600/20 blur-3xl"
    ></div>
  </div>

  <div class="shell grid items-center gap-14 py-20 lg:grid-cols-12 lg:gap-10">
    <!-- Copy -->
    <div class="lg:col-span-7">
      <p class="eyebrow text-secondary-400">Quezon City &middot; Est. 2019</p>

      <h1
        id="hero-heading"
        class="mt-5 max-w-2xl font-display text-display-lg leading-[0.95] font-semibold text-white"
      >
        Matcha worth
        <span class="text-secondary-400">slowing down</span>
        for.
      </h1>

      <p class="mt-6 max-w-lg text-base/relaxed text-primary-100 sm:text-lg/relaxed">
        {{ shop.tagline }} Whisked by hand, poured without hurry, and served the way it was
        meant to be tasted.
      </p>

      <div class="mt-9 flex flex-wrap items-center gap-3">
        <a
          href="#menu"
          class="btn btn-gold btn-lg shadow-lifted"
        >
          Explore the menu
        </a>
        <a
          href="#about"
          class="btn btn-invert btn-lg"
        >
          Our story
        </a>
      </div>

      <!-- Trust strip -->
      <dl class="mt-14 grid max-w-lg grid-cols-2 gap-x-6 gap-y-6 sm:grid-cols-4">
        @for (stat of stats; track stat.label) {
          <div class="border-l border-secondary-400/40 pl-4">
            <dt class="sr-only">{{ stat.label }}</dt>
            <dd>
              <span class="block font-display text-2xl font-semibold text-white">
                {{ stat.value }}
              </span>
              <span class="mt-1 block text-xs text-primary-200">{{ stat.label }}</span>
            </dd>
          </div>
        }
      </dl>
    </div>

    <!-- Visual -->
    <div class="lg:col-span-5">
      <div
        class="relative mx-auto aspect-4/5 w-full max-w-md overflow-hidden rounded-[2rem] border border-secondary-400/25 bg-primary-700"
      >
        <!-- priority: this is the largest above-the-fold element, so it must
             not be lazy-loaded — that would hurt LCP directly. -->
        <app-media-frame
          folder="hero"
          src=""
          alt="Barista whisking ceremonial matcha in a ceramic chawan at the Matcharap bar."
          [width]="800"
          [height]="1000"
          [priority]="true"
        />
      </div>
    </div>
  </div>

  <!-- Scroll cue -->
  <a
    href="#menu"
    class="absolute bottom-7 left-1/2 hidden -translate-x-1/2 text-[0.65rem] tracking-[0.2em] text-primary-200 uppercase hover:text-secondary-400 md:block"
  >
    Scroll
  </a>
</section>
